<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DinoPost AI - Reddit Publisher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="logo">🦖</span>
        <div>
          <h1>DinoPost AI</h1>
          <span class="subtitle">Trợ lý Đăng bài Reddit</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnClearDraft" class="icon-btn" title="Xóa làm mới bản nháp">🗑️</button>
        <button id="btnSettings" class="icon-btn" title="Cài đặt API Key">⚙️</button>
      </div>
    </header>

    <!-- Tab status alert -->
    <div id="tabStatus" class="status-banner">
      <span id="statusDot" class="dot red"></span>
      <span id="statusText">Đang kiểm tra tab Reddit...</span>
      <button id="btnGoSubmit" class="btn-sm hidden">Mở trang Submit</button>
    </div>

    <!-- AI Generator Section -->
    <section class="section ai-section">
      <label class="section-label">💡 Chat với Dino AI (MiniMax M3.1 Flash)</label>
      <div class="ai-input-group">
        <textarea id="promptInput" placeholder="Ví dụ: Viết một bài ngắn chia sẻ trải nghiệm làm đồ án AI cho sinh viên..."></textarea>
        <button id="btnGenerate" class="btn primary">
          <span class="btn-text">Tạo bài với AI</span>
          <span class="spinner hidden"></span>
        </button>
      </div>
      <div id="aiStatusMessage" class="result-message hidden"></div>
    </section>

    <!-- Post Draft Section -->
    <section class="section draft-section">
      <div class="destination-row">
        <label for="destinationInput">Nơi đăng:</label>
        <input type="text" id="destinationInput" value="r/test" placeholder="r/test hoặc u/username">
      </div>

      <div class="field-group">
        <label for="postTitle">Tiêu đề (Title):</label>
        <input type="text" id="postTitle" placeholder="Tiêu đề bài viết...">
      </div>

      <div class="field-group">
        <label for="postBody">Nội dung (Body - Tùy chọn):</label>
        <textarea id="postBody" rows="4" placeholder="Nội dung bài viết..."></textarea>
      </div>
    </section>

    <!-- Media Section (Images & Videos) -->
    <section class="section media-section">
      <div class="media-header">
        <label class="section-label">🖼️ Hình ảnh & Video</label>
        <span id="mediaCount" class="badge-count">0 tệp</span>
      </div>

      <!-- Action buttons -->
      <div class="media-actions">
        <input type="file" id="mediaFileInput" accept="image/*,video/*" multiple class="hidden">
        <button id="btnUploadMedia" type="button" class="btn secondary btn-sm-action">
          📁 Tải từ máy
        </button>
        <button id="btnAiImage" type="button" class="btn primary btn-sm-action" title="Tạo ảnh minh họa bằng AI từ Tiêu đề hoặc Ý tưởng bài viết">
          <span class="btn-text">🎨 Dino AI Vẽ ảnh</span>
          <span class="spinner hidden"></span>
        </button>
      </div>

      <!-- Optional custom AI Image prompt input -->
      <div id="aiPromptRow" class="ai-prompt-row hidden">
        <input type="text" id="aiImagePromptInput" placeholder="Mô tả ảnh muốn vẽ (hoặc bấm để AI vẽ theo bài viết)...">
      </div>

      <!-- Dropzone & Preview Container -->
      <div id="mediaDropzone" class="media-dropzone">
        <div id="mediaEmptyNotice" class="media-empty-notice">
          <span>Kéo & thả ảnh / video vào đây hoặc chọn nút phía trên</span>
          <span class="media-subtext">Hỗ trợ PNG, JPG, GIF, MP4, WebM (tự động đính kèm vào Reddit)</span>
        </div>
        <div id="mediaPreviewList" class="media-preview-list hidden"></div>
      </div>
      <div id="mediaStatusMessage" class="result-message hidden"></div>
    </section>

    <!-- Publish Action -->
    <footer class="app-footer">
      <label class="checkbox-label">
        <input type="checkbox" id="chkAutoSubmit">
        <span>Tự động bấm nút <strong>Đăng</strong> (Bỏ chọn để kiểm tra bài trước khi đăng)</span>
      </label>

      <button id="btnPublish" class="btn success btn-block">
        <span class="btn-text">🚀 Điền vào Reddit & Đăng bài</span>
        <span class="spinner hidden"></span>
      </button>

      <div id="resultMessage" class="result-message hidden"></div>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <h3>Cấu hình API Key</h3>
        <p class="desc">Key dùng để gọi MiniMax M3.1 Flash từ NVIDIA NIM:</p>
        <div class="field-group">
          <label for="apiKeyInput">NVIDIA API Key:</label>
          <input type="password" id="apiKeyInput" placeholder="nvapi-...">
        </div>
        <div class="modal-actions">
          <button id="btnSaveSettings" class="btn primary">Lưu cấu hình</button>
          <button id="btnCloseSettings" class="btn secondary">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
